name: Lint and test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
      - run: npm  ci
      - name: "Checking lint/format errors"
        run: npm run lint
      - name: "Checking type errors"
        run: |
          npm run check

  test:
    runs-on: ubuntu-latest
    # Browsers and their system deps are baked in; do not add `playwright install`.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      # The server workspace spawns a MongoMemoryServer per test file. On a cold runner
      # those spawns race each other downloading and locking the same mongod binary, which
      # kills whole suites at collection time with an "unlock file ... not locked by this
      # process" error. Caching the binary removes that failure mode.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-container

      - run: npm ci

      - name: Check the image has the browsers this Playwright expects
        run: |
          missing=$(npx playwright install --dry-run chromium \
            | sed -n 's/^[[:space:]]*Install location:[[:space:]]*//p' \
            | while IFS= read -r dir; do [ -d "$dir" ] || echo "$dir"; done)
          if [ -n "$missing" ]; then
            echo "::error file=.github/workflows/lint-and-test.yml::The container image is missing browsers this Playwright build expects:"
            echo "$missing"
            echo "::error file=.github/workflows/lint-and-test.yml::Bump the mcr.microsoft.com/playwright image tag to match playwright-core in package-lock.json."
            exit 1
          fi

      - name: "Tests (node)"
        run: npm run test

      - name: "Tests (browser)"
        run: npm run test:client

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          # Newer than the other jobs on purpose: the e2e servers under tests/ are
          # TypeScript run directly by node via --experimental-strip-types, which
          # needs Node >= 22.6.
          node-version: "22"
          cache: "npm"

      # The harness starts its own MongoMemoryServer (see startTestDatabase in
      # tests/fixtures.ts). Same cache key as the unit-test job so they share the
      # downloaded mongod binary.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-container

      - run: npm ci

      - name: Check the image has the browsers this Playwright expects
        run: |
          missing=$(npx playwright install --dry-run chromium webkit \
            | sed -n 's/^[[:space:]]*Install location:[[:space:]]*//p' \
            | while IFS= read -r dir; do [ -d "$dir" ] || echo "$dir"; done)
          if [ -n "$missing" ]; then
            echo "::error file=.github/workflows/lint-and-test.yml::The container image is missing browsers this Playwright build expects:"
            echo "$missing"
            echo "::error file=.github/workflows/lint-and-test.yml::Bump the mcr.microsoft.com/playwright image tag to match playwright-core in package-lock.json."
            exit 1
          fi

      - name: "Tests (e2e)"
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-check:
    runs-on:
      group: aws-general-8-plus
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: |
          docker build \
            --build-arg INCLUDE_DB=true \
            -t chat-ui-test:latest .

      - name: Run Docker container
        run: |
          export DOTENV_LOCAL=$(<.env.ci)
          docker run -d --rm --network=host \
            --name chat-ui-test \
            -e DOTENV_LOCAL="$DOTENV_LOCAL" \
            chat-ui-test:latest

      - name: Wait for server to start
        run: |
          for i in {1..10}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -q "200"; then
              echo "Server is up"
              exit 0
            fi
            echo "Waiting for server..."
            sleep 2
          done
          echo "Server did not start in time"
          docker logs chat-ui-test
          exit 1

      - name: Stop Docker container
        if: always()
        run: |
          docker stop chat-ui-test || true

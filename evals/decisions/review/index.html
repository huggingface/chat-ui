<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Case Review</title>
		<style>
			:root {
				--bg: #f7f7f5;
				--panel: #ffffff;
				--ink: #1d1d1b;
				--muted: #6b6b66;
				--line: #e3e2dd;
				--code: #f1f0ec;
				--pass: #1f7a4d;
				--pass-bg: #e3f3ea;
				--fail: #b3261e;
				--fail-bg: #fbe7e5;
				--na: #6b6b66;
				--na-bg: #ecebe7;
				--accent: #2f5bd3;
				--mark: #fff1a8;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #161615;
					--panel: #1f1f1d;
					--ink: #ecebe6;
					--muted: #9b9a93;
					--line: #33332f;
					--code: #262623;
					--pass: #6fd3a0;
					--pass-bg: #18392a;
					--fail: #f3958d;
					--fail-bg: #43201d;
					--na: #a9a8a1;
					--na-bg: #2c2c29;
					--accent: #8aa8ff;
					--mark: #5a4b12;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font:
					14px/1.5 -apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
			}
			header {
				position: sticky;
				top: 0;
				z-index: 5;
				display: flex;
				align-items: center;
				gap: 16px;
				padding: 10px 20px;
				background: var(--panel);
				border-bottom: 1px solid var(--line);
			}
			header h1 {
				margin: 0;
				font-size: 15px;
				font-weight: 600;
			}
			nav {
				display: flex;
				gap: 4px;
				flex-wrap: wrap;
			}
			nav button {
				border: 1px solid var(--line);
				background: transparent;
				color: var(--ink);
				border-radius: 6px;
				padding: 4px 10px;
				font: inherit;
				cursor: pointer;
			}
			nav button.on {
				background: var(--ink);
				color: var(--panel);
				border-color: var(--ink);
			}
			nav .count {
				color: var(--muted);
				margin-left: 6px;
				font-variant-numeric: tabular-nums;
			}
			nav button.on .count {
				color: inherit;
				opacity: 0.7;
			}
			.keys {
				margin-left: auto;
				color: var(--muted);
				font-size: 12px;
			}
			kbd {
				font:
					11px ui-monospace,
					SFMono-Regular,
					Menlo,
					monospace;
				border: 1px solid var(--line);
				border-bottom-width: 2px;
				border-radius: 4px;
				padding: 0 4px;
				background: var(--panel);
			}
			main {
				display: grid;
				grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
				gap: 16px;
				padding: 16px 20px 40px;
			}
			@media (max-width: 900px) {
				main {
					grid-template-columns: 1fr;
				}
			}
			.col {
				display: flex;
				flex-direction: column;
				gap: 12px;
				min-width: 0;
			}
			.right {
				position: sticky;
				top: 60px;
				align-self: start;
				max-height: calc(100vh - 76px);
				overflow: auto;
			}
			section {
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 12px 14px;
			}
			section h2 {
				margin: 0 0 8px;
				font-size: 12px;
				font-weight: 600;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--muted);
			}
			.meta {
				display: flex;
				flex-wrap: wrap;
				gap: 6px 14px;
				color: var(--muted);
				font-size: 13px;
			}
			.meta b {
				color: var(--ink);
				font-weight: 600;
			}
			pre,
			.mono {
				font:
					12px/1.45 ui-monospace,
					SFMono-Regular,
					Menlo,
					monospace;
				white-space: pre-wrap;
				word-break: break-word;
				margin: 0;
			}
			pre {
				background: var(--code);
				border-radius: 6px;
				padding: 8px 10px;
				max-height: 360px;
				overflow: auto;
			}
			pre.tall {
				max-height: 600px;
			}
			mark {
				background: var(--mark);
				color: inherit;
				border-radius: 2px;
			}
			details {
				margin-top: 6px;
			}
			summary {
				cursor: pointer;
				color: var(--muted);
				font-size: 13px;
			}
			.text {
				white-space: pre-wrap;
				word-break: break-word;
			}
			.clamp {
				display: -webkit-box;
				-webkit-line-clamp: 6;
				-webkit-box-orient: vertical;
				overflow: hidden;
			}
			.round {
				border-top: 1px dashed var(--line);
				padding-top: 8px;
				margin-top: 8px;
			}
			.round:first-of-type {
				border-top: 0;
				margin-top: 0;
				padding-top: 0;
			}
			.call {
				margin-top: 6px;
			}
			.tool {
				display: inline-block;
				font:
					600 12px ui-monospace,
					SFMono-Regular,
					Menlo,
					monospace;
				background: var(--na-bg);
				border-radius: 4px;
				padding: 1px 6px;
				margin-bottom: 4px;
			}
			.chip {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				border-radius: 999px;
				padding: 2px 10px;
				font-weight: 600;
				font-size: 13px;
			}
			.chip.pass {
				color: var(--pass);
				background: var(--pass-bg);
			}
			.chip.fail {
				color: var(--fail);
				background: var(--fail-bg);
			}
			.chip.na {
				color: var(--na);
				background: var(--na-bg);
			}
			.verdict {
				border: 2px solid var(--ink);
			}
			.buttons {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
			}
			.buttons button,
			.labels button {
				font: inherit;
				border-radius: 8px;
				border: 1px solid var(--line);
				background: var(--panel);
				color: var(--ink);
				padding: 8px 12px;
				cursor: pointer;
			}
			.buttons button.sel {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
			.labels {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				margin-top: 10px;
			}
			.labels button.pass {
				border-color: var(--pass);
			}
			.labels button.fail {
				border-color: var(--fail);
			}
			.labels button.sel {
				background: var(--ink);
				color: var(--panel);
			}
			textarea {
				width: 100%;
				margin-top: 10px;
				min-height: 54px;
				font: inherit;
				color: var(--ink);
				background: var(--bg);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 8px;
				resize: vertical;
			}
			.nav {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-top: 10px;
				color: var(--muted);
				font-size: 13px;
			}
			.nav button {
				font: inherit;
				background: none;
				border: 0;
				color: var(--accent);
				cursor: pointer;
			}
			.status {
				font-size: 13px;
				margin-top: 8px;
				color: var(--muted);
			}
			.summary {
				display: grid;
				gap: 16px;
				padding: 16px 20px 40px;
			}
			table {
				border-collapse: collapse;
				width: 100%;
				font-variant-numeric: tabular-nums;
			}
			th,
			td {
				text-align: left;
				padding: 5px 8px;
				border-bottom: 1px solid var(--line);
			}
			th {
				color: var(--muted);
				font-weight: 500;
				font-size: 12px;
			}
			.big {
				font-size: 22px;
				font-weight: 600;
			}
			.stats {
				display: flex;
				gap: 28px;
				flex-wrap: wrap;
				margin-bottom: 10px;
			}
			.stats div span {
				display: block;
				color: var(--muted);
				font-size: 12px;
			}
			a.case {
				color: var(--accent);
				cursor: pointer;
				text-decoration: none;
				font:
					12px ui-monospace,
					SFMono-Regular,
					Menlo,
					monospace;
			}
			.empty {
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Case review</h1>
			<nav id="tabs"></nav>
			<div class="keys">
				<kbd>A</kbd> agree · <kbd>D</kbd> wrong label, then <kbd>1</kbd>–<kbd>9</kbd> ·
				<kbd>X</kbd> not a real case · <kbd>←</kbd><kbd>→</kbd> move · <kbd>U</kbd> next unreviewed
				· <kbd>N</kbd> note
			</div>
		</header>
		<div id="view"></div>
		<script>
			const TRIGGER =
				/CUDA out of memory|OutOfMemoryError|CUDA error: out of memory|unexpected keyword argument|cannot import name|has no attribute/;
			let data;
			let tab = "summary";
			let position = {};
			let picking = false;
			let current;

			const esc = (s) =>
				String(s ?? "").replace(
					/[&<>"']/g,
					(c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
				);
			const chip = (label, pass) =>
				`<span class="chip ${pass === true ? "pass" : pass === false ? "fail" : "na"}">${esc(label)} · ${
					pass === true ? "right call" : pass === false ? "wrong call" : "not judged"
				}</span>`;

			function highlight(text) {
				return esc(text)
					.split("\n")
					.map((line) => (TRIGGER.test(line) ? `<mark>${line}</mark>` : line))
					.join("\n");
			}

			function pretty(value) {
				const short = JSON.stringify(
					value,
					(key, v) =>
						typeof v === "string" && v.length > 400 ? `${v.slice(0, 400)}… [${v.length} chars]` : v,
					2
				);
				const full = JSON.stringify(value, null, 2);
				if (short === full) return `<pre>${esc(full)}</pre>`;
				return `<pre>${esc(short)}</pre><details><summary>Full arguments</summary><pre class="tall">${esc(full)}</pre></details>`;
			}

			function parseArgs(raw) {
				try {
					return pretty(JSON.parse(raw));
				} catch {
					return `<pre>${esc(raw)}</pre>`;
				}
			}

			async function load() {
				data = await (await fetch("/api/state")).json();
				for (const f of data.families) position[f.family] ??= 0;
				render();
			}

			function familyOf(name) {
				return data.families.find((f) => f.family === name);
			}

			function reviewed(f) {
				return f.cases.filter((c) => data.verdicts[c.id]).length;
			}

			function renderTabs() {
				document.getElementById("tabs").innerHTML =
					data.families
						.map(
							(f) =>
								`<button data-tab="${f.family}" class="${tab === f.family ? "on" : ""}">${esc(f.family)}<span class="count">${reviewed(f)}/${f.cases.length}</span></button>`
						)
						.join("") +
					`<button data-tab="summary" class="${tab === "summary" ? "on" : ""}">Summary</button>`;
				for (const b of document.querySelectorAll("#tabs button"))
					b.onclick = () => {
						tab = b.dataset.tab;
						render();
					};
			}

			function render() {
				renderTabs();
				if (tab === "summary") return renderSummary();
				renderCase();
			}

			async function renderCase() {
				const f = familyOf(tab);
				const entry = f.cases[position[tab]];
				const view = document.getElementById("view");
				if (!entry) {
					view.innerHTML = `<main><section class="empty">No cases in this family.</section></main>`;
					return;
				}
				if (current?.id !== entry.id) {
					view.innerHTML = `<main><section class="empty">Loading…</section></main>`;
					current = await (await fetch(`/api/case?id=${encodeURIComponent(entry.id)}`)).json();
					if (tab !== current.family || f.cases[position[tab]].id !== current.id) return;
				}
				const c = current;
				const v = data.verdicts[c.id];
				const action = c.observed.action;

				const left = [];
				left.push(`<section><div class="meta">
					<span><b>${esc(c.model.id)}</b>${c.model.provider ? ` @ ${esc(c.model.provider)}` : ""}</span>
					<span>${esc(
						String(c.date?.$date ?? c.date ?? "")
							.slice(0, 16)
							.replace("T", " ")
					)}</span>
					<span>conversation <span class="mono">${esc(c.conversationId)}</span></span>
					<span>round ${c.round}</span>
					${c.context?.failedFlavor ? `<span>ran out of memory on <b>${esc(c.context.failedFlavor)}</b></span>` : ""}
				</div></section>`);
				left.push(`<section><h2>The task</h2><div class="text clamp" id="task">${esc(c.firstUser)}</div>
					<details><summary>Whole first message</summary><div class="text">${esc(c.firstUser)}</div></details>
					${c.lastUser ? `<h2 style="margin-top:12px">Latest user message</h2><div class="text">${esc(c.lastUser)}</div>` : ""}</section>`);
				if (c.trigger)
					left.push(
						`<section><h2>What it was reacting to · ${esc(c.trigger.tool)}</h2><pre class="tall">${highlight(c.trigger.excerpt)}</pre></section>`
					);
				if (c.previousAnswer)
					left.push(`<section><h2>Its previous answer</h2><div class="text clamp">${esc(c.previousAnswer)}</div>
						<details><summary>Whole answer</summary><div class="text">${esc(c.previousAnswer)}</div></details></section>`);
				if (c.rounds.length)
					left.push(
						`<section><h2>Last ${c.rounds.length} rounds before the decision</h2>${c.rounds
							.map(
								(r, i) => `<div class="round">
							${r.reasoning ? `<details><summary>Reasoning</summary><div class="text">${esc(r.reasoning)}</div></details>` : ""}
							${r.preamble ? `<div class="text">${esc(r.preamble)}</div>` : ""}
							${r.calls
								.map(
									(call) => `<div class="call"><span class="tool">${esc(call.name)}</span>
								<pre class="clampable">${esc(call.args)}</pre>
								${call.result ? `<details><summary>Result</summary><pre class="tall">${highlight(call.result)}</pre></details>` : ""}</div>`
								)
								.join("")}</div>`
							)
							.join("")}</section>`
					);

				const right = [];
				let did;
				if (action.kind === "final") {
					did = `<div class="text">${esc(action.text)}</div>`;
				} else {
					did = `${action.reasoning ? `<details open><summary>Its reasoning</summary><div class="text clamp">${esc(action.reasoning)}</div><details><summary>All of it</summary><div class="text">${esc(action.reasoning)}</div></details></details>` : ""}
						${action.preamble ? `<div class="text">${esc(action.preamble)}</div>` : ""}
						${action.calls.map((call) => `<div class="call"><span class="tool">${esc(call.name)}</span>${pretty(call.args)}</div>`).join("")}
						${c.scripts
							.map(
								(s) =>
									`<details><summary>Script ${esc(s.name)} as of the decision${s.content ? "" : " (not found before the cut)"}</summary><pre class="tall">${highlight(s.content)}</pre></details>`
							)
							.join("")}`;
				}
				right.push(`<section><h2>What production did next</h2>${did}</section>`);

				const labels = Object.entries(f.labels);
				right.push(`<section class="verdict">
					<h2>The miner says</h2>
					<div>${chip(c.observed.label, c.observed.pass)}</div>
					<div class="buttons" style="margin-top:12px">
						<button data-v="agree" class="${v?.verdict === "agree" ? "sel" : ""}"><kbd>A</kbd> Label is right</button>
						<button data-v="disagree" class="${v?.verdict === "disagree" || picking ? "sel" : ""}"><kbd>D</kbd> Wrong label</button>
						<button data-v="invalid" class="${v?.verdict === "invalid" ? "sel" : ""}"><kbd>X</kbd> Not a real case</button>
					</div>
					${
						picking || v?.verdict === "disagree"
							? `<div class="labels">${labels
									.map(
										([label, pass], i) =>
											`<button data-label="${esc(label)}" class="${pass === true ? "pass" : pass === false ? "fail" : ""} ${v?.label === label ? "sel" : ""}"><kbd>${i + 1}</kbd> ${esc(label)}</button>`
									)
									.join("")}</div>`
							: ""
					}
					<textarea id="note" placeholder="Note (optional): why it's wrong, or what the scorer should catch">${esc(v?.note ?? "")}</textarea>
					<div class="status">${
						v
							? v.verdict === "agree"
								? "Saved: label is right."
								: v.verdict === "invalid"
									? "Saved: not a real case."
									: `Saved: should be ${esc(v.label)}.`
							: "Not reviewed yet."
					}</div>
					<div class="nav"><button id="prev">← Previous</button><span>${position[tab] + 1} of ${f.cases.length} · ${reviewed(f)} reviewed</span><button id="next">Next →</button></div>
				</section>`);

				view.innerHTML = `<main><div class="col">${left.join("")}</div><div class="col right">${right.join("")}</div></main>`;
				for (const b of view.querySelectorAll("[data-v]")) b.onclick = () => decide(b.dataset.v);
				for (const b of view.querySelectorAll("[data-label]"))
					b.onclick = () => decide("disagree", b.dataset.label);
				document.getElementById("prev").onclick = () => move(-1);
				document.getElementById("next").onclick = () => move(1);
				const note = document.getElementById("note");
				note.onchange = () => {
					const saved = data.verdicts[c.id];
					if (saved) save(c.id, { ...saved, note: note.value });
				};
			}

			async function save(id, verdict) {
				data.verdicts[id] = { ...verdict, at: new Date().toISOString() };
				await fetch("/api/verdict", {
					method: "POST",
					body: JSON.stringify({ id, ...verdict }),
				});
			}

			async function decide(kind, label) {
				const note = document.getElementById("note")?.value || undefined;
				if (kind === "disagree" && !label) {
					picking = true;
					return renderCase();
				}
				picking = false;
				await save(current.id, { verdict: kind, label, note });
				nextUnreviewed(true);
			}

			function move(step) {
				const f = familyOf(tab);
				picking = false;
				position[tab] = Math.max(0, Math.min(f.cases.length - 1, position[tab] + step));
				render();
			}

			function nextUnreviewed(afterSave) {
				const f = familyOf(tab);
				const n = f.cases.length;
				for (let i = 1; i <= n; i++) {
					const at = (position[tab] + i) % n;
					if (!data.verdicts[f.cases[at].id]) {
						position[tab] = at;
						return render();
					}
				}
				if (afterSave) {
					tab = "summary";
				}
				render();
			}

			function estimate(f) {
				let judged = 0;
				let passed = 0;
				let autoJudged = 0;
				let autoPassed = 0;
				let invalid = 0;
				for (const [label, count] of Object.entries(f.population)) {
					const autoPass = f.labels[label];
					if (autoPass !== null && autoPass !== undefined) {
						autoJudged += count;
						if (autoPass) autoPassed += count;
					}
					const done = f.cases.filter((c) => c.label === label && data.verdicts[c.id]);
					if (!done.length) {
						if (autoPass !== null && autoPass !== undefined) {
							judged += count;
							if (autoPass) passed += count;
						}
						continue;
					}
					for (const c of done) {
						const v = data.verdicts[c.id];
						const weight = count / done.length;
						if (v.verdict === "invalid") {
							invalid += weight;
							continue;
						}
						const pass = f.labels[v.verdict === "agree" ? c.label : v.label];
						if (pass === null || pass === undefined) continue;
						judged += weight;
						if (pass) passed += weight;
					}
				}
				return {
					auto: autoJudged ? autoPassed / autoJudged : null,
					corrected: judged ? passed / judged : null,
					invalid: f.total ? invalid / f.total : 0,
				};
			}

			const pct = (x) => (x === null ? "–" : `${Math.round(x * 100)}%`);

			function renderSummary() {
				const view = document.getElementById("view");
				view.innerHTML = `<div class="summary">${data.families
					.map((f) => {
						const done = f.cases.filter((c) => data.verdicts[c.id]);
						const agree = done.filter((c) => data.verdicts[c.id].verdict === "agree").length;
						const invalid = done.filter((c) => data.verdicts[c.id].verdict === "invalid").length;
						const e = estimate(f);
						const rows = Object.entries(f.population)
							.sort((a, b) => b[1] - a[1])
							.map(([label, count]) => {
								const sampled = f.cases.filter((c) => c.label === label);
								const seen = sampled.filter((c) => data.verdicts[c.id]);
								const ok = seen.filter((c) => data.verdicts[c.id].verdict === "agree").length;
								return `<tr><td>${chip(label, f.labels[label])}</td><td>${count}</td><td>${seen.length}/${sampled.length}</td><td>${seen.length ? pct(ok / seen.length) : "–"}</td></tr>`;
							})
							.join("");
						const issues = done
							.filter((c) => data.verdicts[c.id].verdict !== "agree")
							.map((c) => {
								const v = data.verdicts[c.id];
								return `<tr><td><a class="case" data-open="${esc(c.id)}">${esc(c.id.split("/").slice(1, 2)[0])}…</a></td><td>${esc(c.label)}</td><td>${v.verdict === "invalid" ? "not a real case" : `→ ${esc(v.label)}`}</td><td>${esc(v.note ?? "")}</td></tr>`;
							})
							.join("");
						return `<section><h2>${esc(f.family)}</h2>
							<div class="stats">
								<div><span>Reviewed</span><b class="big">${done.length}/${f.cases.length}</b></div>
								<div><span>Label right</span><b class="big">${done.length ? pct(agree / done.length) : "–"}</b></div>
								<div><span>Not real cases</span><b class="big">${invalid}</b></div>
								<div><span>Right-call rate, miner</span><b class="big">${pct(e.auto)}</b></div>
								<div><span>Right-call rate, corrected</span><b class="big">${done.length ? pct(e.corrected) : "–"}</b></div>
							</div>
							<table><tr><th>Miner label</th><th>All cases</th><th>Reviewed</th><th>Label right</th></tr>${rows}</table>
							${issues ? `<h2 style="margin-top:14px">Disagreements</h2><table><tr><th>Conversation</th><th>Miner said</th><th>You said</th><th>Note</th></tr>${issues}</table>` : ""}
						</section>`;
					})
					.join("")}
					<p class="empty">Corrected rates weight each label's verdicts by how common that label is across all cases, and drop cases marked not real.</p></div>`;
				for (const a of view.querySelectorAll("[data-open]"))
					a.onclick = () => {
						const id = a.dataset.open;
						tab = id.split("/")[0];
						position[tab] = familyOf(tab).cases.findIndex((c) => c.id === id);
						render();
					};
			}

			document.addEventListener("keydown", (e) => {
				if (e.target.tagName === "TEXTAREA") {
					if (e.key === "Escape") e.target.blur();
					return;
				}
				if (e.metaKey || e.ctrlKey || e.altKey || tab === "summary" || !current) return;
				const key = e.key.toLowerCase();
				if (key === "a") decide("agree");
				else if (key === "d") decide("disagree");
				else if (key === "x") decide("invalid");
				else if (key === "arrowright" || key === "j") move(1);
				else if (key === "arrowleft" || key === "k") move(-1);
				else if (key === "u") nextUnreviewed(false);
				else if (key === "n") {
					e.preventDefault();
					document.getElementById("note")?.focus();
				} else if (
					(picking || data.verdicts[current.id]?.verdict === "disagree") &&
					/^[1-9]$/.test(key)
				) {
					const label = Object.keys(familyOf(tab).labels)[Number(key) - 1];
					if (label) decide("disagree", label);
				}
			});

			load();
		</script>
	</body>
</html>
